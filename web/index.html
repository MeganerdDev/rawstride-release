<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rawstride WebAssembly</title>
<style>
body{background:#e9e2d2;color:#1c1a16;font:18px Georgia,serif;max-width:850px;margin:60px auto;padding:24px;border:4px double #1c1a16}h1{letter-spacing:.2em}button,select,input{font:inherit;margin:10px 8px 10px 0;padding:8px}pre{white-space:pre-wrap;font:14px monospace}a{color:inherit}button{background:#1c1a16;color:#e9e2d2;border:0;cursor:pointer}
</style>
<h1>RAWSTRIDE</h1>
<p>WebAssembly camera-file decoding to exact 16-bit sensor samples.</p>
<input id="file" type="file" aria-label="Camera RAW file">
<label>Threads <select id="threads"><option>1</option><option>2</option><option>4</option><option selected>8</option></select></label>
<button id="decode">Decode</button>
<pre id="status">Select a RAW file. No file leaves your browser.</pre>
<a id="download" hidden>Download sensor samples</a>
<script type="module">
import {createRawstride} from "./rawstride.js";
const file = document.querySelector("#file"), threads = document.querySelector("#threads");
const button = document.querySelector("#decode"), status = document.querySelector("#status");
const download = document.querySelector("#download");
let url;
if (!crossOriginIsolated) {threads.value="1"; threads.disabled=true;}
button.onclick = async () => {
  if (!file.files.length) {status.textContent="Select a RAW file first."; return;}
  button.disabled=true;
  download.hidden=true;
  let decoder;
  try {
    status.textContent="Loading decoder...";
    decoder = await createRawstride({threads:Number(threads.value)});
    const bytes = await file.files[0].arrayBuffer();
    status.textContent="Decoding...";
    const result = await decoder.decode(bytes, {transfer:true});
    status.textContent=JSON.stringify({width:result.width,height:result.height,threads:result.threads,elapsedMs:result.timings.totalMs,format:"Full sensor plane, little-endian uint16; not RGB"},null,2);
    if (url) URL.revokeObjectURL(url);
    url=URL.createObjectURL(new Blob([result.data],{type:"application/octet-stream"}));
    download.href=url;
    download.download=file.files[0].name+".sensor.u16";
    download.hidden=false;
  } catch(error) {status.textContent=String(error.message || error);}
  finally {decoder?.close(); button.disabled=false;}
};
</script>
</html>
